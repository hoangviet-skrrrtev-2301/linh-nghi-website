# ==========================================================
# Cấu hình Nginx cho website. Script setup-vps.sh sẽ tự thay TEN_MIEN.
# Đường dẫn trên VPS: /etc/nginx/sites-available/linh-nghi
# SSL (https) do Certbot tự thêm vào file này sau khi chạy.
# ==========================================================

# Giới hạn tần suất ở tầng Nginx (bổ sung cho giới hạn trong ứng dụng)
limit_req_zone $binary_remote_addr zone=ln_general:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name TEN_MIEN www.TEN_MIEN;

    # Ẩn phiên bản Nginx
    server_tokens off;

    # Ảnh upload tối đa (5 ảnh x 10MB mỗi lượt)
    client_max_body_size 60m;

    # Địa chỉ www luôn chuyển 301 về tên miền chính (một nội dung chỉ có một địa chỉ, tốt cho SEO)
    if ($host = www.TEN_MIEN) { return 301 $scheme://TEN_MIEN$request_uri; }

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/xml text/plain font/woff2;
    gzip_min_length 1024;

    # Ảnh đã upload: Nginx phục vụ trực tiếp, nhanh hơn qua Node
    location /uploads/ {
        alias APP_DIR/database/uploads/;
        # Tên file ảnh có mã ngẫu nhiên, không bao giờ đổi nội dung: cho trình duyệt giữ 1 năm
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        # Không bao giờ thực thi file trong thư mục upload
        location ~* \.(php|js|html|sh|py)$ { deny all; }
        try_files $uri =404;
    }

    # Chặn truy cập file ẩn (.env, .git...)
    location ~ /\. { deny all; return 404; }

    location / {
        limit_req zone=ln_general burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
